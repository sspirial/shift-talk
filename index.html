<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shift Talk — Factory Floor Language Trainer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1E21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shift Talk">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #1B1E21;
}

.st-root {
  --bg: #1B1E21;
  --surface: #24282C;
  --surface-raised: #2C3136;
  --steel: #5A7A8F;
  --steel-dim: #3D5563;
  --yellow: #FFC53D;
  --yellow-dim: #8A6C1F;
  --orange: #E8590C;
  --red: #D6564F;
  --green: #5FA777;
  --text: #ECEAE3;
  --text-dim: #9BA3AA;
  --text-faint: #6B7278;
  --line: #383E44;
  --rivet: #40464C;
  --font-display: 'Oswald', sans-serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;

  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  border-radius: 0;
  padding: 0;
  overflow: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  position: relative;
}

.st-root * { box-sizing: border-box; }

/* ---------- hazard stripe ---------- */
.st-hazard {
  height: 10px;
  width: 100%;
  background: repeating-linear-gradient(
    135deg,
    var(--yellow) 0px, var(--yellow) 14px,
    #1a1a1a 14px, #1a1a1a 28px
  );
  flex-shrink: 0;
}

/* ---------- layout shell ---------- */
.st-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

.st-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 22px 22px 32px;
}

/* ---------- header ---------- */
.st-header {
  padding: 18px 22px 4px;
}
.st-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--yellow);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}
.st-eyebrow::before {
  content: "";
  width: 7px; height: 7px;
  background: var(--yellow);
  display: inline-block;
}
.st-title {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  margin: 4px 0 2px;
  color: var(--text);
}
.st-subtitle {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 14px;
}

/* ---------- punch card streak strip ---------- */
.st-punch {
  display: flex;
  align-items: stretch;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 18px;
}
.st-punch-cell {
  flex: 1;
  padding: 10px 14px;
  border-right: 1px dashed var(--line);
}
.st-punch-cell:last-child { border-right: none; }
.st-punch-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.st-punch-value {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--yellow);
  margin-top: 2px;
}

/* ---------- language tabs (zone signage) ---------- */
.st-zones {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.st-zone {
  flex: 1;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 6px;
  padding: 12px 10px;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
  font-family: var(--font-body);
}
.st-zone:hover { border-color: var(--steel); }
.st-zone.active {
  border-color: var(--zone-color, var(--yellow));
  background: var(--surface-raised);
}
.st-zone-chip {
  width: 26px; height: 26px;
  border-radius: 4px;
  background: var(--zone-color, var(--yellow));
  margin: 0 auto 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: #14161a;
}
.st-zone-name {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.st-zone-native {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 1px;
}

/* ---------- section label ---------- */
.st-section-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin: 4px 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

/* ---------- category plates ---------- */
.st-plates {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.st-plate {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 14px;
  cursor: pointer;
  position: relative;
  transition: transform 0.12s, border-color 0.12s;
}
.st-plate:hover { transform: translateY(-2px); border-color: var(--steel); }
.st-plate::before, .st-plate::after {
  content: "";
  position: absolute;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--rivet);
  top: 8px;
}
.st-plate::before { left: 8px; }
.st-plate::after { right: 8px; }
.st-plate-icon {
  font-family: var(--font-mono);
  font-size: 20px;
  color: var(--plate-color, var(--steel));
  margin-bottom: 8px;
}
.st-plate-title {
  font-family: var(--font-display);
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}
.st-plate-bar-track {
  height: 5px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 6px;
}
.st-plate-bar-fill {
  height: 100%;
  background: var(--plate-color, var(--steel));
  border-radius: 3px;
  transition: width 0.3s;
}
.st-plate-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
}
.st-plate-disabled {
  cursor: default;
  opacity: 0.55;
}
.st-plate-disabled:hover { transform: none; border-color: var(--line); }

/* ---------- sentence builder ---------- */
.st-sentence-prompt {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
  text-align: center;
}
.st-sentence-en {
  font-size: 17px;
  color: var(--text);
  margin-bottom: 4px;
}
.st-sentence-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.st-build-area {
  min-height: 64px;
  background: var(--surface-raised);
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-content: flex-start;
  margin-bottom: 14px;
}
.st-build-empty {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  padding: 8px;
}
.st-chip {
  background: var(--yellow);
  color: #14161a;
  border: none;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  line-height: 1.3;
}
.st-chip-roman {
  display: block;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  color: #4a3a08;
  margin-top: 1px;
}
.st-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
  min-height: 44px;
}
.st-bank .st-chip {
  background: var(--surface-raised);
  color: var(--text);
  border: 1px solid var(--line);
}
.st-bank .st-chip .st-chip-roman { color: var(--text-faint); }
.st-sentence-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.st-sentence-actions .st-nav-btn { flex: 1; }
.st-sentence-result {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 14px;
}
.st-sentence-correct-line {
  font-size: 18px;
  margin: 6px 0 2px;
}
.st-sentence-correct-roman {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--yellow);
}

/* ---------- lesson screen ---------- */
.st-lesson-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.st-back {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.st-back:hover { color: var(--yellow); border-color: var(--yellow); }
.st-lesson-title {
  font-family: var(--font-display);
  font-size: 18px;
  text-transform: uppercase;
}

.st-mode-toggle {
  display: flex;
  gap: 6px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.st-mode-btn {
  flex: 1;
  min-width: 72px;
  text-align: center;
  padding: 9px 4px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  color: var(--text-dim);
}
.st-mode-btn.active {
  background: var(--steel-dim);
  border-color: var(--steel);
  color: var(--text);
}

/* ---------- speak / listen shared ---------- */
.st-practice-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 26px 20px;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
}
.st-mic-btn {
  width: 68px; height: 68px;
  border-radius: 50%;
  background: var(--yellow);
  color: #14161a;
  border: none;
  font-size: 26px;
  cursor: pointer;
  margin: 14px auto 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s;
}
.st-mic-btn:hover { transform: scale(1.06); }
.st-mic-btn.listening {
  background: var(--orange);
  animation: st-pulse 0.6s ease-in-out infinite alternate;
}
.st-mic-btn:disabled { opacity: 0.4; cursor: default; }
.st-mic-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 4px;
}
.st-feedback {
  border-radius: 8px;
  padding: 12px 14px;
  margin: 14px 0;
  text-align: left;
  font-size: 13px;
  border: 1px solid var(--line);
}
.st-feedback.correct { border-color: var(--green); background: rgba(95,167,119,0.1); color: var(--green); }
.st-feedback.close { border-color: var(--yellow); background: rgba(255,197,61,0.1); color: var(--yellow); }
.st-feedback.incorrect { border-color: var(--red); background: rgba(214,86,79,0.1); color: var(--red); }
.st-feedback-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}
.st-listen-mystery {
  font-family: var(--font-mono);
  font-size: 46px;
  color: var(--text-faint);
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.st-listen-reveal .st-card-native { font-size: 34px; margin-bottom: 4px; }
.st-text-fallback {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.st-text-fallback input {
  flex: 1;
  background: var(--surface-raised);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 10px 12px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
}
.st-text-fallback button {
  background: var(--yellow);
  color: #14161a;
  border: none;
  border-radius: 5px;
  padding: 0 16px;
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
}
.st-practice-nav {
  display: flex;
  gap: 10px;
  justify-content: space-between;
}
.st-support-note {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  text-align: center;
  margin-top: 10px;
  line-height: 1.5;
}

/* ---------- sync panel ---------- */
.st-sync {
  margin-top: 22px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 4px 14px;
  background: var(--surface);
}
.st-sync summary {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--yellow);
  padding: 12px 0;
  cursor: pointer;
}
.st-sync-body { padding-bottom: 16px; }
.st-sync-body p {
  font-size: 12px;
  color: var(--text-dim);
  margin: 0 0 10px;
}
.st-sync-row { margin-bottom: 8px; }
.st-sync-textarea {
  width: 100%;
  background: var(--surface-raised);
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 10px;
  resize: vertical;
}
.st-sync-divider {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 16px 0 8px;
  border-top: 1px dashed var(--line);
  padding-top: 14px;
}
.st-sync-msg {
  font-family: var(--font-mono);
  font-size: 11px;
  margin-top: 8px;
}
.st-sync-msg.ok { color: var(--green); }
.st-sync-msg.err { color: var(--red); }

.st-qr-wrap {
  display: flex;
  justify-content: center;
  background: #ffffff;
  padding: 14px;
  border-radius: 8px;
  margin: 14px 0;
}
.st-sync-fallback {
  margin-top: 14px;
  border-top: 1px dashed var(--line);
  padding-top: 10px;
}
.st-sync-fallback summary {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
}

/* ---------- QR scan overlay ---------- */
.st-scan-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 11, 12, 0.95);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.st-scan-video {
  width: 100%;
  max-width: 360px;
  border-radius: 10px;
  border: 2px solid var(--yellow);
  background: #000;
}
.st-scan-status {
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  margin-top: 14px;
  text-align: center;
  max-width: 320px;
  line-height: 1.5;
}
.st-scan-cancel {
  margin-top: 18px;
  padding: 11px 22px;
  border-radius: 5px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
}

/* ---------- flashcard ---------- */
.st-card-wrap {
  perspective: 1200px;
  margin-bottom: 18px;
}
.st-card {
  min-height: 200px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 24px;
  text-align: center;
  position: relative;
}
.st-card::before {
  content: attr(data-tag);
  position: absolute;
  top: 12px; left: 14px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.st-card-native {
  font-size: 40px;
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.2;
}
.st-card-roman {
  font-family: var(--font-mono);
  font-size: 15px;
  color: var(--yellow);
  margin-bottom: 14px;
}
.st-card-english {
  font-size: 18px;
  color: var(--text-dim);
  border-top: 1px dashed var(--line);
  padding-top: 14px;
  margin-top: 4px;
  width: 100%;
}
.st-card-hint {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 14px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.st-speak-btn {
  position: static;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--yellow);
  color: #14161a;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  cursor: pointer;
  margin: 16px auto 0;
  transition: transform 0.12s, background 0.12s;
}
.st-speak-btn:hover { transform: scale(1.08); }
.st-speak-btn.speaking { background: var(--orange); animation: st-pulse 0.6s ease-in-out infinite alternate; }
.st-speak-btn.inline {
  width: 30px; height: 30px;
  font-size: 13px;
  margin: 0 0 0 8px;
  flex-shrink: 0;
}
@keyframes st-pulse {
  from { box-shadow: 0 0 0 0 rgba(232, 89, 12, 0.5); }
  to { box-shadow: 0 0 0 7px rgba(232, 89, 12, 0); }
}
.st-quiz-native-row, .st-card-native-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.st-voice-note {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-faint);
  text-align: center;
  margin-top: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.st-card-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.st-nav-btn {
  padding: 10px 16px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.st-nav-btn:hover { border-color: var(--steel); }
.st-nav-btn:disabled { opacity: 0.35; cursor: default; }
.st-dots {
  display: flex; gap: 6px;
}
.st-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--line);
}
.st-dot.on { background: var(--yellow); }

/* ---------- quiz ---------- */
.st-quiz-progress {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.st-quiz-prompt {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 26px 20px;
  text-align: center;
  margin-bottom: 16px;
}
.st-quiz-native {
  font-size: 34px;
  font-weight: 600;
  margin-bottom: 6px;
}
.st-quiz-roman {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--yellow);
}
.st-quiz-instruction {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 10px;
}
.st-options {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.st-option {
  text-align: left;
  padding: 13px 16px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.st-option:hover { border-color: var(--steel); }
.st-option.correct {
  border-color: var(--green);
  background: rgba(95, 167, 119, 0.12);

  const TTS_LANG = { zh: "zh-CN", ja: "ja-JP", ko: "ko-KR" };
  const MALE_VOICE_HINTS = {
    zh: ["kangkang", "yunxi", "yunyang", "yunjian", "yunfeng", "zhiwei", "male"],
    ja: ["ichiro", "keita", "otoya", "daichi", "male"],
    ko: ["injoon", "hyunsu", "male"],
  };
  const FEMALE_VOICE_HINTS = {
    zh: ["yaoyao", "xiaoxiao", "huihui", "tingting", "xiaoyi", "female"],
    ja: ["haruka", "kyoko", "nanami", "ayumi", "female"],
    ko: ["heami", "sunhi", "female"],
  };
  let voicesReady = false;
  let cachedVoices = [];

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    cachedVoices = window.speechSynthesis.getVoices();
    if (cachedVoices.length) voicesReady = true;
  }
  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickVoice(bcp47, langCode) {
    if (!cachedVoices.length) loadVoices();
    const langVoices = cachedVoices.filter(v => v.lang === bcp47 || (v.lang && v.lang.startsWith(bcp47.split('-')[0])));
    if (!langVoices.length) return { voice: null, isMaleMatch: false };
    const maleHints = MALE_VOICE_HINTS[langCode] || [];
    const male = langVoices.find(v => maleHints.some(h => v.name.toLowerCase().includes(h)));
    if (male) return { voice: male, isMaleMatch: true };
    const femaleHints = FEMALE_VOICE_HINTS[langCode] || [];
    const nonFemale = langVoices.find(v => !femaleHints.some(h => v.name.toLowerCase().includes(h)));
    return { voice: nonFemale || langVoices[0], isMaleMatch: false };
  }

  function speak(text, langCode, btnEl) {
    if (!('speechSynthesis' in window)) {
      if (btnEl) btnEl.title = "Voice not supported on this device";
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const bcp47 = TTS_LANG[langCode] || "en-US";
    utter.lang = bcp47;
    utter.rate = 0.82;
    const { voice, isMaleMatch } = pickVoice(bcp47, langCode);
    if (voice) utter.voice = voice;
    // Deepen the pitch so it reads as a lower, more masculine voice.
    // If we already matched a known male voice, only a slight nudge is needed.
    utter.pitch = isMaleMatch ? 0.9 : 0.68;
    if (btnEl) {
      utter.onstart = () => btnEl.classList.add('speaking');
      utter.onend = () => btnEl.classList.remove('speaking');
      utter.onerror = () => btnEl.classList.remove('speaking');
    }
    window.speechSynthesis.speak(utter);
  }

  // ---------------- speech recognition (STT) helpers ----------------
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const sttSupported = !!SpeechRecognitionCtor;

  function normalizeNative(s) {
    return (s || "").replace(/[\s,.!?、。！？，·・]/g, "").toLowerCase();
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    return dp[m][n];
  }

  function gradeNativeAttempt(expectedNative, recognizedRaw) {
    const expected = normalizeNative(expectedNative);
    const recognized = normalizeNative(recognizedRaw);
    if (!recognized) return { grade: "incorrect", recognized: recognizedRaw };
    if (recognized === expected) return { grade: "correct", recognized: recognizedRaw };
    // recognized text containing the expected string (or vice versa) covers cases
    // where the recognizer picks up a trailing particle or filler
    if (recognized.includes(expected) || expected.includes(recognized)) {
      return { grade: "close", recognized: recognizedRaw };
    }
    const dist = levenshtein(expected, recognized);
    const threshold = Math.max(1, Math.floor(expected.length * 0.4));
    if (dist <= threshold) return { grade: "close", recognized: recognizedRaw };
    return { grade: "incorrect", recognized: recognizedRaw };
  }

  const ENGLISH_STOPWORDS = new Set(["a","an","the","to","your","you","is","are","of","for","on","in","at","it","be","me","i","my","this","that"]);

  function gradeEnglishAttempt(expectedEnglish, userText) {
    const cleanExpected = expectedEnglish.toLowerCase().replace(/[^a-z\s]/g, "");
    const expWords = cleanExpected.split(/\s+/).filter(w => w && !ENGLISH_STOPWORDS.has(w));
    const cleanUser = " " + userText.toLowerCase().replace(/[^a-z\s]/g, "") + " ";
    if (!expWords.length) return { grade: "incorrect" };
    const hits = expWords.filter(w => cleanUser.includes(" " + w) || cleanUser.includes(w)).length;
    const ratio = hits / expWords.length;
    if (ratio >= 0.99) return { grade: "correct" };
    if (ratio >= 0.4) return { grade: "close" };
    return { grade: "incorrect" };
  }

  function runRecognition(bcp47, onResult, onError) {
    if (!sttSupported) { onError("unsupported"); return; }
    let rec;
    try {
      rec = new SpeechRecognitionCtor();
    } catch (e) { onError("unsupported"); return; }
    rec.lang = bcp47;
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.continuous = false;
    let settled = false;
    rec.onresult = (ev) => {
      settled = true;
      const text = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : "";
      onResult(text);
    };
    rec.onerror = (ev) => {
      if (settled) return;
      settled = true;
      onError(ev.error || "error");
    };
    rec.onend = () => {
      if (!settled) { settled = true; onError("no-speech"); }
    };
    try { rec.start(); } catch (e) { onError("unsupported"); }
    return rec;
  }

  // ---------------- state ----------------
  let state = {
    lang: "zh",
    view: "home",        // home | lesson
    category: null,
    mode: "learn",        // learn | quiz
    cardIndex: 0,
    flipped: false,
    quiz: null,           // { qIndex, questions, score, answered }
    lastSpokenKey: null,
    speak: null,           // { idx, phase, result }
    listen: null,          // { idx, phase, result, typed }
    syncPanelOpen: false,
    syncMsg: null,          // { text, ok }
    syncOutCode: null,
    syncShowQr: false,
    sentence: null,        // { idx, placed: [chunkIdx...], bankOrder: [...], checked, correct }
  };
  let activeRecognition = null;

  let progress = null; // loaded from storage
  const LS_KEY = "shifttalk_progress";

  function mergeProgressStructure(parsed) {
    progress = Object.assign(defaultProgress(), parsed);
    Object.keys(VOCAB).forEach(l => {
      if (!progress.langs[l]) progress.langs[l] = {};
      CATEGORY_ORDER.forEach(c => {
        if (!progress.langs[l][c]) progress.langs[l][c] = { mastered: [], attempts: 0, bestScore: 0 };
      });
    });
    if (!progress.sentences) progress.sentences = {};
    Object.keys(VOCAB).forEach(l => {
      if (!progress.sentences[l]) progress.sentences[l] = { mastered: [] };
    });
  }

  function defaultProgress() {
    const p = { streak: 0, lastVisit: null, langs: {}, sentences: {} };
    Object.keys(VOCAB).forEach(l => {
      p.langs[l] = {};
      CATEGORY_ORDER.forEach(c => {
        p.langs[l][c] = { mastered: [], attempts: 0, bestScore: 0 };
      });
      p.sentences[l] = { mastered: [] };
    });
    return p;
  }

  async function loadProgress() {
    let raw = null;
    // Prefer the Claude artifact storage API when previewed inside claude.ai;
    // fall back to plain localStorage for a standalone hosted deployment.
    try {
      if (window.storage && typeof window.storage.get === "function") {
        const res = await window.storage.get('progress', false);
        raw = res ? res.value : null;
      } else {
        raw = localStorage.getItem(LS_KEY);
      }
    } catch (e) {
      try { raw = localStorage.getItem(LS_KEY); } catch (e2) { raw = null; }
    }
    if (raw) {
      try { mergeProgressStructure(JSON.parse(raw)); }
      catch (e) { progress = defaultProgress(); }
    } else {
      progress = defaultProgress();
    }
    bumpStreak();
    render();
  }

  function bumpStreak() {
    const today = new Date().toDateString();
    if (progress.lastVisit !== today) {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      progress.streak = (progress.lastVisit === yesterday) ? progress.streak + 1 : 1;
      progress.lastVisit = today;
      saveProgress();
    }
  }

  async function saveProgress() {
    const json = JSON.stringify(progress);
    try {
      if (window.storage && typeof window.storage.set === "function") {
        await window.storage.set('progress', json, false);
        return;
      }
    } catch (e) { /* fall through to localStorage */ }
    try { localStorage.setItem(LS_KEY, json); } catch (e) { /* best effort */ }
  }

  // ---------------- cross-device sync code (no backend required) ----------------
  // Packs progress into a compact array (bitmask per category) so the code
  // is short enough to render as a scannable QR code.
  const SYNC_LANG_ORDER = ["zh", "ja", "ko"];

  function packSyncData() {
    const cats = [];
    SYNC_LANG_ORDER.forEach(l => {
      CATEGORY_ORDER.forEach(c => {
        const p = progress.langs[l][c];
        let bitmask = 0;
        (p.mastered || []).forEach(idx => { if (idx >= 0 && idx < MASTERY_BITS) bitmask |= (1 << idx); });
        cats.push([bitmask, p.attempts || 0, p.bestScore || 0]);
      });
    });
    const sentMasks = SYNC_LANG_ORDER.map(l => {
      let m = 0;
      const mastered = (progress.sentences && progress.sentences[l] && progress.sentences[l].mastered) || [];
      mastered.forEach(idx => { if (idx >= 0 && idx < MASTERY_BITS) m |= (1 << idx); });
      return m;
    });
    const epochDay = progress.lastVisit ? Math.floor(new Date(progress.lastVisit).getTime() / 86400000) : null;
    return [1, progress.streak || 0, epochDay, cats, sentMasks];
  }

  function unpackSyncData(arr) {
    if (!Array.isArray(arr) || arr[0] !== 1 || !Array.isArray(arr[3])) throw new Error("bad sync format");
    const p = defaultProgress();
    p.streak = arr[1] || 0;
    p.lastVisit = (arr[2] != null) ? new Date(arr[2] * 86400000).toDateString() : null;
    let i = 0;
    SYNC_LANG_ORDER.forEach(l => {
      CATEGORY_ORDER.forEach(c => {
        const entry = arr[3][i++] || [0, 0, 0];
        const [bitmask, attempts, bestScore] = entry;
        const mastered = [];
        for (let b = 0; b < MASTERY_BITS; b++) { if (bitmask & (1 << b)) mastered.push(b); }
        p.langs[l][c] = { mastered, attempts: attempts || 0, bestScore: bestScore || 0 };
      });
    });
    const sentMasks = arr[4] || [];
    SYNC_LANG_ORDER.forEach((l, idx) => {
      const mask = sentMasks[idx] || 0;
      const mastered = [];
      for (let b = 0; b < MASTERY_BITS; b++) { if (mask & (1 << b)) mastered.push(b); }
      p.sentences[l] = { mastered };
    });
    return p;
  }

  function generateSyncCode() {
    return btoa(JSON.stringify(packSyncData()));
  }

  function applySyncCode(code) {
    try {
      const arr = JSON.parse(atob(code.trim()));
      progress = unpackSyncData(arr);
      saveProgress();
      return true;
    } catch (e) {
      return false;
    }
  }

  function totalMastered() {
    let total = 0;
    Object.keys(progress.langs).forEach(l => {
      CATEGORY_ORDER.forEach(c => {
        total += progress.langs[l][c].mastered.length;
      });
    });
    return total;
  }

  function totalWords() {
    let total = 0;
    Object.keys(VOCAB).forEach(l => {
      CATEGORY_ORDER.forEach(c => { total += VOCAB[l].categories[c].words.length; });
    });
    return total;
  }

  // ---------------- helpers ----------------
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------- render ----------------
  // ---------------- sentence builder view ----------------
  function shuffleIndices(n) {
    const idxs = Array.from({ length: n }, (_, i) => i);
    return shuffle(idxs);
  }

  function ensureSentence() {
    const list = SENTENCES[state.lang] || [];
    if (!list.length) return;
    if (!state.sentence) {

  }

    const s = state.sentence;
    const sent = list[s.idx];
    const bankIdxs = s.bankOrder.filter(i => !s.placed.includes(i));

      ? s.placed.map((chunkIdx, pos) => {

        <div class="st-dots">${dots}</div>

      </div>

  function render() {

  function renderSentencePlate(lang) {

    const mastered = totalMastered();

            <button class="st-nav-btn" data-sync-qr="1" style="flex:1;">Show My QR Code</button>
            <button class="st-nav-btn" data-sync-scan="1" style="flex:1;">Scan a Code</button>
          </div>
          ${state.syncShowQr ? `<div id="stQrOut" class="st-qr-wrap"></div>` : ""}

          <details class="st-sync-fallback">
            <summary>Or use a text code instead</summary>
            <div style="margin-top:10px;">
              <textarea id="stSyncOut" class="st-sync-textarea" rows="3" readonly placeholder="Tap 'Show My QR Code' above, or generate one here…">${state.syncOutCode ? esc(state.syncOutCode) : ""}</textarea>
              <button class="st-nav-btn" data-sync-copy="1" style="margin-top:6px;">Copy Code</button>
              <div class="st-sync-divider">Paste a code from another device:</div>
              <textarea id="stSyncIn" class="st-sync-textarea" rows="3" placeholder="Paste sync code…"></textarea>
              <button class="st-nav-btn" data-sync-apply="1" style="margin-top:6px;">Apply Code</button>
            </div>
          </details>
          <div id="stSyncMsg" class="st-sync-msg ${state.syncMsg ? (state.syncMsg.ok ? 'ok' : 'err') : ''}">${state.syncMsg ? esc(state.syncMsg.text) : ""}</div>
        </div>
      </details>
    `;
  }

  function renderLesson() {
    const lang = VOCAB[state.lang];
    const cat = lang.categories[state.category];

    let body = "";
    if (state.mode === "learn") {
      const idx = state.cardIndex;
      const w = cat.words[idx];
      const dots = cat.words.map((_, i) => `<div class="st-dot ${i === idx ? 'on' : ''}"></div>`).join("");
      body = `
        <div class="st-card-wrap">
          <div class="st-card" data-flip="1" data-tag="${lang.code} &middot; ${idx + 1}/${cat.words.length}">
            <div class="st-card-native">${esc(w.n)}</div>
            <div class="st-card-roman">${esc(w.r)}</div>
            ${state.flipped ? `<div class="st-card-english">${esc(w.e)}</div>` : `<div class="st-card-hint">Tap card to reveal meaning</div>`}
            <button class="st-speak-btn" data-speak="${esc(w.n)}" title="Play pronunciation">&#128266;</button>
          </div>
        </div>
        <div class="st-card-nav">
          <button class="st-nav-btn" data-prev="1" ${idx === 0 ? "disabled" : ""}>&larr; Prev</button>
          <div class="st-dots">${dots}</div>
          <button class="st-nav-btn" data-next="1" ${idx === cat.words.length - 1 ? "disabled" : ""}>Next &rarr;</button>
        </div>
        <div class="st-voice-note">Tap the speaker for native pronunciation &middot; auto-plays on new cards</div>
      `;
    } else if (state.mode === "quiz") {
      body = renderQuiz(lang, cat);
    } else if (state.mode === "speak") {
      body = renderSpeak(lang, cat);
    } else if (state.mode === "listen") {
      body = renderListen(lang, cat);
    }

    app.innerHTML = `
      <div class="st-lesson-top">
        <div class="st-back" data-home="1">&larr; Floor</div>
        <div class="st-lesson-title">${cat.label}</div>
      </div>
      <div class="st-mode-toggle">
        <div class="st-mode-btn ${state.mode === 'learn' ? 'active' : ''}" data-mode="learn">Learn</div>
        <div class="st-mode-btn ${state.mode === 'quiz' ? 'active' : ''}" data-mode="quiz">Quiz</div>
        <div class="st-mode-btn ${state.mode === 'speak' ? 'active' : ''}" data-mode="speak">Speak</div>
        <div class="st-mode-btn ${state.mode === 'listen' ? 'active' : ''}" data-mode="listen">Listen</div>
      </div>
      ${body}
    `;
  }

  // ---------------- speak mode (repeat-after-me pronunciation practice) ----------------
  function ensureSpeak() {
    if (state.speak) return;
    state.speak = { idx: 0, phase: "ready", result: null, revealed: false };
  }

  function renderSpeak(lang, cat) {
    ensureSpeak();
    const s = state.speak;
    const w = cat.words[s.idx];
    const bcp47 = TTS_LANG[state.lang];

    let feedbackHtml = "";
    if (s.result) {
      const r = s.result;
      const cls = r.grade === "correct" ? "correct" : r.grade === "close" ? "close" : "incorrect";
      const label = r.grade === "correct" ? "Nailed it" : r.grade === "close" ? "Close — small gap" : "Not quite — try again";
      feedbackHtml = `
        <div class="st-feedback ${cls}">
          <strong>${label}</strong>
          <div class="st-feedback-sub">You said: ${esc(r.recognized || "(nothing recognized)")}</div>
        </div>`;
    }

    let micHtml;
    if (!sttSupported) {
      micHtml = `<div class="st-support-note">Speech recognition isn't supported in this browser.<br>Try Chrome on Android, then repeat the word aloud and self-check against the meaning below.</div>
        ${!s.revealed ? `<button class="st-nav-btn" data-reveal-speak="1" style="margin-top:10px;">Show Meaning</button>` : `<div class="st-card-english" style="border:none;padding-top:10px;">${esc(w.e)}</div>`}`;
    } else {
      const listening = s.phase === "listening";
      micHtml = `
        <button class="st-mic-btn ${listening ? 'listening' : ''}" data-mic="1" ${listening ? "disabled" : ""}>&#127908;</button>
        <div class="st-mic-label">${listening ? "Listening…" : "Tap and say it"}</div>
        ${feedbackHtml}
      `;
    }

    const dots = cat.words.map((_, i) => `<div class="st-dot ${i === s.idx ? 'on' : ''}"></div>`).join("");

    return `
      <div class="st-practice-card" data-tag="${lang.code} &middot; ${s.idx + 1}/${cat.words.length}">
        <div class="st-card-native">${esc(w.n)}</div>
        <div class="st-card-roman">${esc(w.r)}</div>
        ${micHtml}
        <button class="st-speak-btn" data-speak="${esc(w.n)}" title="Play pronunciation">&#128266;</button>
      </div>
      <div class="st-practice-nav">
        <button class="st-nav-btn" data-speak-prev="1" ${s.idx === 0 ? "disabled" : ""}>&larr; Prev</button>
        <div class="st-dots">${dots}</div>
        <button class="st-nav-btn" data-speak-next="1" ${s.idx === cat.words.length - 1 ? "disabled" : ""}>Next &rarr;</button>
      </div>
      <div class="st-voice-note">Listen, then repeat the word out loud into your mic</div>
    `;
  }

  // ---------------- listen mode (audio-first comprehension) ----------------
  function ensureListen() {
    if (state.listen) return;
    state.listen = { idx: 0, phase: "ready", result: null };
  }

  function renderListen(lang, cat) {
    ensureListen();
    const s = state.listen;
    const w = cat.words[s.idx];

    let body;
    if (s.phase !== "revealed") {
      const listening = s.phase === "listening";
      let feedbackHtml = "";
      if (s.result) {
        const cls = s.result.grade === "correct" ? "correct" : s.result.grade === "close" ? "close" : "incorrect";
        const label = s.result.grade === "correct" ? "Correct" : s.result.grade === "close" ? "Close — check the full meaning" : "Not quite";
        feedbackHtml = `<div class="st-feedback ${cls}"><strong>${label}</strong>${s.result.userText ? `<div class="st-feedback-sub">You said: ${esc(s.result.userText)}</div>` : ""}</div>`;
      }
      const micRow = sttSupported ? `
        <button class="st-mic-btn ${listening ? 'listening' : ''}" data-listen-mic="1" ${listening ? "disabled" : ""}>&#127908;</button>
        <div class="st-mic-label">${listening ? "Listening…" : "Tap and say the meaning in English"}</div>
      ` : "";
      body = `
        <div class="st-practice-card" data-tag="${lang.code} &middot; ${s.idx + 1}/${cat.words.length}">
          <div class="st-listen-mystery">? ? ?</div>
          <button class="st-speak-btn" style="position:static; display:inline-flex; margin-top:6px;" data-speak="${esc(w.n)}" title="Play audio">&#128266; Replay</button>
          ${micRow}
          <div class="st-text-fallback">
            <input type="text" id="stListenInput" placeholder="Or type what it means…">
            <button data-listen-submit="1">Check</button>
          </div>
          ${feedbackHtml}
          <div class="st-support-note" style="margin-top:10px;"><span data-listen-reveal="1" style="text-decoration:underline; cursor:pointer;">Show answer</span></div>
        </div>
      `;
    } else {
      body = `
        <div class="st-practice-card st-listen-reveal" data-tag="${lang.code} &middot; ${s.idx + 1}/${cat.words.length}">
          <div class="st-card-native">${esc(w.n)}</div>
          <div class="st-card-roman">${esc(w.r)}</div>
          <div class="st-card-english">${esc(w.e)}</div>
          <button class="st-speak-btn" data-speak="${esc(w.n)}" title="Play pronunciation">&#128266;</button>
        </div>
      `;
    }

    const dots = cat.words.map((_, i) => `<div class="st-dot ${i === s.idx ? 'on' : ''}"></div>`).join("");
    return `
      ${body}
      <div class="st-practice-nav">
        <button class="st-nav-btn" data-listen-prev="1" ${s.idx === 0 ? "disabled" : ""}>&larr; Prev</button>
        <div class="st-dots">${dots}</div>
        <button class="st-nav-btn" data-listen-next="1" ${s.idx === cat.words.length - 1 ? "disabled" : ""}>Next &rarr;</button>
      </div>
      <div class="st-voice-note">Listen first, then say or type what it means &middot; text stays hidden until you answer</div>
    `;
  }

  function ensureQuiz(cat) {
    if (state.quiz) return;
    const questions = shuffle(cat.words).map(w => {
      const distractors = shuffle(cat.words.filter(x => x !== w)).slice(0, 3).map(x => x.e);
      const options = shuffle([w.e, ...distractors]);
      return { word: w, options, answered: false, picked: null };
    });
    state.quiz = { qIndex: 0, questions, score: 0, done: false };
  }

  function renderQuiz(lang, cat) {
    ensureQuiz(cat);
    const q = state.quiz;

    if (q.done) {
      const total = q.questions.length;
      return `
        <div class="st-quiz-result">
          <div class="st-quiz-result-score">${q.score}/${total}</div>
          <div class="st-quiz-result-label">Correct on this shift</div>
          <button class="st-quiz-result-btn" data-retry="1">Run It Again</button>
          <button class="st-quiz-result-btn secondary" data-home="1">Back to Floor</button>
        </div>
      `;
    }

    const current = q.questions[q.qIndex];
    const optionsHtml = current.options.map(opt => {
      let cls = "st-option";
      if (current.answered) {
        cls += " disabled";
        if (opt === current.word.e) cls += " correct";
        else if (opt === current.picked) cls += " incorrect";
      }
      return `<button class="${cls}" data-opt="${esc(opt)}">${esc(opt)}</button>`;
    }).join("");

    return `
      <div class="st-quiz-progress">Question ${q.qIndex + 1} of ${q.questions.length} &middot; Score ${q.score}</div>
      <div class="st-quiz-prompt">
        <div class="st-quiz-native-row">
          <div class="st-quiz-native">${esc(current.word.n)}</div>
          <button class="st-speak-btn inline" data-speak="${esc(current.word.n)}" title="Play pronunciation">&#128266;</button>
        </div>
        <div class="st-quiz-roman">${esc(current.word.r)}</div>
        <div class="st-quiz-instruction">What does this mean?</div>
      </div>
      <div class="st-options">${optionsHtml}</div>
    `;
  }

  // ---------------- event handling ----------------
  function stopActiveRecognition() {
    if (activeRecognition) {
      try { activeRecognition.abort(); } catch (e) {}
      activeRecognition = null;
    }
  }

  function micErrorNote(err) {
    if (err === "not-allowed" || err === "service-not-allowed") return "Microphone access was blocked — allow it in your browser's site settings.";
    if (err === "no-speech") return "Didn't catch anything — try again a bit closer to the mic.";
    if (err === "unsupported") return "Speech recognition isn't available on this device/browser.";
    return "Couldn't process that — try again.";
  }

  function attachHandlers() {
    app.querySelectorAll('[data-zone]').forEach(el => {
      el.onclick = () => { state.lang = el.dataset.zone; render(); };
    });
    app.querySelectorAll('[data-cat]').forEach(el => {
      el.onclick = () => {
        stopActiveRecognition();
        state.view = "lesson";
        state.category = el.dataset.cat;
        state.mode = "learn";
        state.cardIndex = 0;
        state.flipped = false;
        state.quiz = null;
        state.speak = null;
        state.listen = null;
        state.lastSpokenKey = null;
        render();
      };
    });
    const sentencesPlate = app.querySelector('[data-sentences]');
    if (sentencesPlate) sentencesPlate.onclick = () => {
      stopActiveRecognition();
      state.view = "sentences";
      state.sentence = null;
      render();
    };
    app.querySelectorAll('[data-home]').forEach(el => {
      el.onclick = () => {
        stopActiveRecognition();
        state.view = "home";
        state.quiz = null;
        state.speak = null;
        state.listen = null;
        state.sentence = null;
        render();
      };
    });
    app.querySelectorAll('[data-mode]').forEach(el => {
      el.onclick = () => {
        stopActiveRecognition();
        state.mode = el.dataset.mode;
        if (state.mode === "quiz") state.quiz = null;
        if (state.mode === "speak") state.speak = null;
        if (state.mode === "listen") state.listen = null;
        state.lastSpokenKey = null;
        render();
      };
    });
    const card = app.querySelector('[data-flip]');
    if (card) card.onclick = () => { state.flipped = !state.flipped; render(); };

    const prevBtn = app.querySelector('[data-prev]');
    if (prevBtn) prevBtn.onclick = () => {
      if (state.cardIndex > 0) { state.cardIndex--; state.flipped = false; render(); }
    };
    const nextBtn = app.querySelector('[data-next]');
    if (nextBtn) nextBtn.onclick = () => {
      const cat = VOCAB[state.lang].categories[state.category];
      if (state.cardIndex < cat.words.length - 1) { state.cardIndex++; state.flipped = false; render(); }
    };

    app.querySelectorAll('[data-opt]').forEach(el => {
      el.onclick = () => handleQuizAnswer(el.dataset.opt);
    });
    const retryBtn = app.querySelector('[data-retry]');
    if (retryBtn) retryBtn.onclick = () => { state.quiz = null; render(); };

    app.querySelectorAll('[data-speak]').forEach(el => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        speak(el.dataset.speak, state.lang, el);
      };
    });

    // ---- Speak mode ----
    const micBtn = app.querySelector('[data-mic]');
    if (micBtn) micBtn.onclick = () => {
      const cat = VOCAB[state.lang].categories[state.category];
      const w = cat.words[state.speak.idx];
      state.speak.phase = "listening";
      state.speak.result = null;
      render();
      activeRecognition = runRecognition(
        TTS_LANG[state.lang],
        (text) => {
          activeRecognition = null;
          const graded = gradeNativeAttempt(w.n, text);
          state.speak.phase = "ready";
          state.speak.result = graded;
          if (graded.grade !== "incorrect") {
            const catProg = progress.langs[state.lang][state.category];
            catProg.attempts++;
            const wordIdx = cat.words.indexOf(w);
            if (!catProg.mastered.includes(wordIdx)) catProg.mastered.push(wordIdx);
            saveProgress();
          }
          render();
        },
        (err) => {
          activeRecognition = null;
          state.speak.phase = "ready";
          state.speak.result = { grade: "incorrect", recognized: micErrorNote(err) };
          render();
        }
      );
    };
    const revealSpeakBtn = app.querySelector('[data-reveal-speak]');
    if (revealSpeakBtn) revealSpeakBtn.onclick = () => { state.speak.revealed = true; render(); };
    const speakPrev = app.querySelector('[data-speak-prev]');
    if (speakPrev) speakPrev.onclick = () => {
      stopActiveRecognition();
      if (state.speak.idx > 0) { state.speak.idx--; state.speak.phase = "ready"; state.speak.result = null; state.speak.revealed = false; render(); }
    };
    const speakNext = app.querySelector('[data-speak-next]');
    if (speakNext) speakNext.onclick = () => {
      stopActiveRecognition();
      const cat = VOCAB[state.lang].categories[state.category];
      if (state.speak.idx < cat.words.length - 1) { state.speak.idx++; state.speak.phase = "ready"; state.speak.result = null; state.speak.revealed = false; render(); }
    };

    // ---- Listen mode ----
    function gradeListenAnswer(userText) {
      const cat = VOCAB[state.lang].categories[state.category];
      const w = cat.words[state.listen.idx];
      const graded = gradeEnglishAttempt(w.e, userText);
      state.listen.result = { grade: graded.grade, userText };
      state.listen.phase = graded.grade === "correct" ? "revealed" : "ready";
      if (graded.grade !== "incorrect") {
        const catProg = progress.langs[state.lang][state.category];
        catProg.attempts++;
        const wordIdx = cat.words.indexOf(w);
        if (!catProg.mastered.includes(wordIdx)) catProg.mastered.push(wordIdx);
        saveProgress();
      }
      render();
    }
    const listenMic = app.querySelector('[data-listen-mic]');
    if (listenMic) listenMic.onclick = () => {
      state.listen.phase = "listening";
      render();
      activeRecognition = runRecognition(
        "en-US",
        (text) => { activeRecognition = null; gradeListenAnswer(text); },
        (err) => {
          activeRecognition = null;
          state.listen.phase = "ready";
          state.listen.result = { grade: "incorrect", userText: micErrorNote(err) };
          render();
        }
      );
    };
    const listenSubmit = app.querySelector('[data-listen-submit]');
    if (listenSubmit) listenSubmit.onclick = () => {
      const input = app.querySelector('#stListenInput');
      const val = input ? input.value.trim() : "";
      if (!val) return;
      gradeListenAnswer(val);
    };
    const listenInput = app.querySelector('#stListenInput');
    if (listenInput) listenInput.onkeydown = (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); app.querySelector('[data-listen-submit]').click(); }
    };
    const listenReveal = app.querySelector('[data-listen-reveal]');
    if (listenReveal) listenReveal.onclick = () => { state.listen.phase = "revealed"; render(); };
    const listenPrev = app.querySelector('[data-listen-prev]');
    if (listenPrev) listenPrev.onclick = () => {
      stopActiveRecognition();
      if (state.listen.idx > 0) { state.listen.idx--; state.listen.phase = "ready"; state.listen.result = null; state.lastSpokenKey = null; render(); }
    };
    const listenNext = app.querySelector('[data-listen-next]');
    if (listenNext) listenNext.onclick = () => {
      stopActiveRecognition();
      const cat = VOCAB[state.lang].categories[state.category];
      if (state.listen.idx < cat.words.length - 1) { state.listen.idx++; state.listen.phase = "ready"; state.listen.result = null; state.lastSpokenKey = null; render(); }
    };

    // ---- Sentence builder ----
    function goToSentence(newIdx) {
      const list = SENTENCES[state.lang] || [];
      const sent = list[newIdx];
      state.sentence = { idx: newIdx, placed: [], bankOrder: shuffleIndices(sent.chunks.length), checked: false, correct: null };
      render();
    }
    app.querySelectorAll('[data-bank-idx]').forEach(el => {
      el.onclick = () => {
        if (state.sentence.checked) return;
        state.sentence.placed.push(parseInt(el.dataset.bankIdx, 10));
        render();
      };
    });
    app.querySelectorAll('[data-placed-idx]').forEach(el => {
      el.onclick = () => {
        if (state.sentence.checked) return;
        const pos = parseInt(el.dataset.placedIdx, 10);
        state.sentence.placed.splice(pos, 1);
        render();
      };
    });
    const sentClear = app.querySelector('[data-sentence-clear]');
    if (sentClear) sentClear.onclick = () => {
      state.sentence.placed = [];
      state.sentence.checked = false;
      state.sentence.correct = null;
      render();
    };
    const sentCheck = app.querySelector('[data-sentence-check]');
    if (sentCheck) sentCheck.onclick = () => {
      const list = SENTENCES[state.lang] || [];
      const sent = list[state.sentence.idx];
      const correct = state.sentence.placed.length === sent.chunks.length &&
        state.sentence.placed.every((v, i) => v === i);
      state.sentence.checked = true;
      state.sentence.correct = correct;
      if (correct) {
        const sp = progress.sentences[state.lang];
        if (!sp.mastered.includes(state.sentence.idx)) sp.mastered.push(state.sentence.idx);
        saveProgress();
      }
      render();
      const fullSentence = sent.chunks.map(c => c.c).join("");
      speak(fullSentence, state.lang, null);
    };
    const sentPrev = app.querySelector('[data-sentence-prev]');
    if (sentPrev) sentPrev.onclick = () => { if (state.sentence.idx > 0) goToSentence(state.sentence.idx - 1); };
    const sentNext = app.querySelector('[data-sentence-next]');
    if (sentNext) sentNext.onclick = () => {
      const list = SENTENCES[state.lang] || [];
      if (state.sentence.idx < list.length - 1) goToSentence(state.sentence.idx + 1);
    };

    maybeAutoSpeak();

    // ---- Sync panel (home screen only) ----
    const syncQrBtn = app.querySelector('[data-sync-qr]');
    if (syncQrBtn) syncQrBtn.onclick = () => {
      const code = generateSyncCode();
      state.syncOutCode = code;
      state.syncShowQr = true;
      state.syncPanelOpen = true;
      render();
    };
    const syncScanBtn = app.querySelector('[data-sync-scan]');
    if (syncScanBtn) syncScanBtn.onclick = () => {
      state.syncPanelOpen = true;
      startQrScan();
    };
    const syncCopyBtn = app.querySelector('[data-sync-copy]');
    if (syncCopyBtn) syncCopyBtn.onclick = async () => {
      const out = app.querySelector('#stSyncOut');
      if (out && !out.value) { out.value = generateSyncCode(); state.syncOutCode = out.value; }
      state.syncPanelOpen = true;
      try {
        await navigator.clipboard.writeText(out.value);
        syncCopyBtn.textContent = "Copied!";
        setTimeout(() => { syncCopyBtn.textContent = "Copy Code"; }, 1500);
      } catch (e) {
        out.select();
      }
    };
    const syncApplyBtn = app.querySelector('[data-sync-apply]');
    if (syncApplyBtn) syncApplyBtn.onclick = () => {
      const input = app.querySelector('#stSyncIn');
      const code = input ? input.value.trim() : "";
      if (!code) return;
      const ok = applySyncCode(code);
      state.syncPanelOpen = true;
      state.syncMsg = {
        text: ok ? "Progress loaded from code." : "That code didn't look right — check you copied the whole thing.",
        ok
      };
      render();
    };

    // Render the QR image into the panel now that its container exists in the DOM
    if (state.syncShowQr && state.syncOutCode) {
      const qrEl = app.querySelector('#stQrOut');
      if (qrEl && window.QRCode) {
        qrEl.innerHTML = "";
        new QRCode(qrEl, {
          text: state.syncOutCode,
          width: 220,
          height: 220,
          colorDark: "#14161a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } else if (qrEl) {
        qrEl.innerHTML = `<div style="color:#14161a; font-family:var(--font-mono); font-size:11px; padding:20px; text-align:center;">QR library didn't load — use the text code below instead.</div>`;
      }
    }
  }

  // ---------------- QR camera scan ----------------
  function startQrScan() {
    if (!window.jsQR) {
      state.syncMsg = { text: "QR scanning library didn't load — use the text code fallback instead.", ok: false };
      render();
      return;
    }
    const overlay = document.createElement('div');
    overlay.className = 'st-scan-overlay';
    overlay.innerHTML = `
      <video class="st-scan-video" autoplay playsinline muted></video>
      <div class="st-scan-status" id="stScanStatus">Point your camera at the other phone's QR code…</div>
      <button class="st-scan-cancel" id="stScanCancel">Cancel</button>
    `;
    document.body.appendChild(overlay);
    const video = overlay.querySelector('video');
    const statusEl = overlay.querySelector('#stScanStatus');
    let stream = null;
    let stopped = false;

    function cleanup() {
      stopped = true;
      if (stream) { stream.getTracks().forEach(t => t.stop()); }
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }
    overlay.querySelector('#stScanCancel').onclick = cleanup;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(s => {
        stream = s;
        video.srcObject = s;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        function tick() {
          if (stopped) return;
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const found = jsQR(imageData.data, imageData.width, imageData.height);
            if (found && found.data) {
              const ok = applySyncCode(found.data);
              statusEl.textContent = ok ? "Got it! Loading progress…" : "Scanned something, but it wasn't a valid Shift Talk code.";
              if (ok) {
                setTimeout(() => {
                  cleanup();
                  state.syncPanelOpen = true;
                  state.syncMsg = { text: "Progress loaded from QR scan.", ok: true };
                  render();
                }, 500);
                return;
              }
            }
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })
      .catch(err => {
        statusEl.textContent = "Couldn't access the camera (" + (err && err.name ? err.name : "permission denied") + "). Cancel and use the text code fallback instead.";
      });
  }


  function maybeAutoSpeak() {
    if (state.view !== "lesson") return;
    const cat = VOCAB[state.lang].categories[state.category];
    let key = null, text = null;
    if (state.mode === "learn") {
      key = "learn:" + state.lang + ":" + state.category + ":" + state.cardIndex;
      text = cat.words[state.cardIndex].n;
    } else if (state.mode === "quiz" && state.quiz && !state.quiz.done) {
      const q = state.quiz;
      key = "quiz:" + state.lang + ":" + state.category + ":" + q.qIndex;
      text = q.questions[q.qIndex].word.n;
    } else if (state.mode === "speak" && state.speak) {
      key = "speak:" + state.lang + ":" + state.category + ":" + state.speak.idx;
      text = cat.words[state.speak.idx].n;
    } else if (state.mode === "listen" && state.listen && state.listen.phase !== "revealed") {
      key = "listen:" + state.lang + ":" + state.category + ":" + state.listen.idx;
      text = cat.words[state.listen.idx].n;
    }
    if (key && key !== state.lastSpokenKey) {
      state.lastSpokenKey = key;
      const btn = app.querySelector('[data-speak]');
      speak(text, state.lang, btn);
    }
  }

  function handleQuizAnswer(picked) {
    const q = state.quiz;
    const current = q.questions[q.qIndex];
    if (current.answered) return;
    current.answered = true;
    current.picked = picked;
    const correct = picked === current.word.e;
    if (correct) q.score++;

    const catProg = progress.langs[state.lang][state.category];
    catProg.attempts++;
    if (correct) {
      const wordIdx = VOCAB[state.lang].categories[state.category].words.indexOf(current.word);
      if (!catProg.mastered.includes(wordIdx)) catProg.mastered.push(wordIdx);
    }

    render();

    setTimeout(() => {
      if (q.qIndex < q.questions.length - 1) {
        q.qIndex++;
      } else {
        q.done = true;
        if (q.score > catProg.bestScore) catProg.bestScore = q.score;
        saveProgress();
      }
      render();
    }, 850);
  }

  loadProgress();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // Registration fails silently if the file isn't served from a
        // proper https/localhost origin (e.g. opened as a local download).
      });
    });
  }
})();
</script>
